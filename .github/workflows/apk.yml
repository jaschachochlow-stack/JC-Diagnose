name: APK bauen
on:
  push:
    branches: [main]
    paths: ['android/**', 'index.html', 'app.js', 'app.css', 'data.js', 'jcx.js', 'oszi.js', 'pids.js', 'bericht.js', 'pdf.min.js', 'pdf.worker.min.js', 'package.json', 'capacitor.config.json', '.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Web-Dateien und Plugins
        run: |
          npm ci
          mkdir -p www
          cp index.html app.js app.css data.js jcx.js oszi.js pids.js bericht.js pdf.min.js pdf.worker.min.js sw.js manifest.json icon-192.png icon-512.png www/
          npx cap sync android
      - name: Signaturschlüssel
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS_SECRET: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android/release.jks
            echo "KS_PASS=$KS_PASS_SECRET" >> "$GITHUB_ENV"
          else
            P=$(openssl rand -hex 16); echo "::add-mask::$P"
            keytool -genkeypair -keystore android/release.jks -alias jc -keyalg RSA -keysize 2048 -validity 12000 -storepass "$P" -keypass "$P" -dname "CN=JC Diagnose, C=DE"
            echo "KS_PASS=$P" >> "$GITHUB_ENV"
          fi
      - name: Bauen
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk JC-Diagnose.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: JC Diagnose (Android-App)
          make_latest: true
          body: |
            Android-App mit Bluetooth LE, klassischem Bluetooth (SPP) und WLAN für ELM327-Adapter. Läuft ohne Chrome.
            Installation: JC-Diagnose.apk herunterladen, öffnen, „Unbekannte Apps installieren“ erlauben. Eine ältere Version vorher deinstallieren.
            Build ${{ github.run_number }}
          files: JC-Diagnose.apk
